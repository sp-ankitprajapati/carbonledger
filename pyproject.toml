[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "carbonledger"
version = "0.2.0"
requires-python = ">=3.11"
description = "Auditable demonstration carbon accounting with explicit unit contracts"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "scikit-learn>=1.5,<2", "reportlab>=4.2,<5", "joblib>=1.4,<2"]
[project.optional-dependencies]
ui = ["streamlit>=1.66,<2", "pandas>=2.2,<4"]
gemini = ["google-genai>=1,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdf>=5,<7"]
[tool.setuptools]
packages = ["app"]
py-modules = ["main"]
[tool.setuptools.package-data]
app = ["data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
